<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Currículo</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="curriculo.css">
</head>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background-color: #c996ab;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container{
      width: 900px;
      background-color:#f5c7da;
      padding: 30px;
      border: 2px solid #e7c7cf;
    }

    .linha{
      width: 100%;
      height: 4px;
      background-color: rgb(121, 4, 59);
      border-radius: 10px;
    }

    h1{
      text-align: center;
      color: rgb(121, 4, 59);
      font-size: 60px;
      margin: 20px 0 30px;
    }

    .imagem{
      display: flex;
      justify-content: center;
    }

    .imagem img{
      width: 500px;
      border: 2px solid #999;
    }

    .linha-baixo{
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="linha"></div>

    <h1>Currículo</h1>

    <div class="imagem">
      <img src="img/curriculo.png" alt="História de Vida">
    </div>

    <div class="linha linha-baixo"></div>

<img src="./image-removebg-preview (5).png" class="flor">



  </div>

</body>
</html>
