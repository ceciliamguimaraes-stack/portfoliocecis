<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LINGUAGENS</title>

    <link rel="stylesheet" href="stilo.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

            <!-- CARDS -->
            <div class="cards">

        </section>

                <span class="linha"></span>

            </div>

            <!-- APENAS UM BOTÃO -->
            <div class="atividades">

                <button class="btn-atividade"
                    onclick="abrirAtividade(

                    ATIVIDADE ESCOLHIDA

                </button>

            </div>


            <!-- CARDS -->
            <div class="cards">

                <div class="card">
                    <img src="./img/lingaugens5.png" alt="Atividade 1">
                    <span class="data">13/04/2026</span>
                </div>

                <div class="card">
                    <img src="./img/linguagens6.png" alt="Atividade 2">
                    <span class="data">20/04/2026</span>
                </div>

                <div class="card">
                    <img src="./img/lingaugens7.png" alt="Atividade 3">
                    <span class="data">25/04/2026</span>
                </div>

                <div class="card">
                    <img src="./img/linguagens8.png" alt="Atividade 4">
                    <span class="data">26/05/2026</span>
                </div>

                <div class="card">
                    <img src="./linguagens10.png" alt="Atividade 5">
                    <span class="data">03/06/2026</span>
                </div>

            </div>

        </section>


        <!-- EIXO 3 -->
        <section class="eixo">

            <div class="titulo-eixo">
                <span class="linha"></span>
                <h2>EIXO 3</h2>
            </div>

            <!-- APENAS UM BOTÃO -->
            <div class="atividades">

                <button class="btn-atividade"
                    onclick="abrirAtividade(

            <div class="cards">

                
                <div class="card">

                </div>

                <div class="card">

                </div>

                 <div class="card">
                    <img src="./quadrocomporativo.png" alt="Atividade do Eixo 3">
                    <span class="data">24/08/2026</span>
                </div>

                <div class="card">

        <!-- EIXO 4 -->

            <!-- APENAS UM BOTÃO -->
            <div class="atividades">

                    onclick="abrirAtividade(

                    )">

                    <img src="./img/image copy 7.png" alt="Atividade do Eixo 4">
                </div>

            </div>

        </section>

    </div>


    <!-- MODAL DA ATIVIDADE -->

    <div class="modal" id="modal">

        <div class="conteudo-modal">

            <span class="fechar" onclick="fecharAtividade()">
                &times;
            </span>

            <img id="imagemGrande" src="" alt="Imagem da atividade">

            <h2 id="tituloAtividade"></h2>

            <p id="descricaoAtividade"></p>

        </div>

    </div>


    <script>

        function abrirAtividade(imagem, titulo, descricao) {

            document.getElementById("imagemGrande").src = imagem;

            document.getElementById("tituloAtividade").innerText = titulo;

            document.getElementById("descricaoAtividade").innerText = descricao;

            document.getElementById("modal").style.display = "flex";

        }


        function fecharAtividade() {

            document.getElementById("modal").style.display = "none";

        }


        document.getElementById("modal").addEventListener("click", function (event) {

            if (event.target === this) {

                fecharAtividade();

            }

        });


        /* FECHAR COM A TECLA ESC */

        document.addEventListener("keydown", function (event) {

            if (event.key === "Escape") {

                fecharAtividade();

            }

        });

    </script>

</body>

</html>
