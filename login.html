<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfólio</title>
    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="pagina-auth">

    <div class="center">
        <h1>LOGIN</h1>

        <form id="loginForm">
            <div class="text_field">
                <input type="email" id="email" required autocomplete="email">
                <label for="email">E-mail</label>
            </div>

            <div class="text_field">
                <input type="password" id="senha" required autocomplete="current-password">
                <label for="senha">Senha</label>
            </div>

            <p id="mensagem"></p>

            <div class="botoes">
                <input type="submit" value="Entrar">
            </div>

            <div class="signup_link">
                Não é membro? <a href="cadastro.html">Cadastre-se!</a>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://tkgwntyzlzuvjrcdhcre.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9d3JAJtGyDgB4R6ncvWj3g_fzXeYj4h';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginForm = document.getElementById("loginForm");
        const mensagem = document.getElementById("mensagem");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            // Trata e-mail para minúsculas e remove espaços das pontas
            const email = document.getElementById("email").value.trim().toLowerCase();
            const senha = document.getElementById("senha").value;

            mensagem.style.color = "#000000";
            mensagem.textContent = "Verificando credenciais...";

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({
                    email: email,
                    password: senha
                });

                if (error) {
                    mensagem.style.color = "red";
                    if (error.message.includes("Invalid login credentials")) {
                        mensagem.textContent = "E-mail ou senha incorretos. Recrie o usuário no Supabase se o erro persistir.";
                    } else {
                        mensagem.textContent = "Erro ao entrar: " + error.message;
                    }
                } else {
                    mensagem.style.color = "green";
                    mensagem.textContent = "Login efetuado! Entrando...";

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                }
            } catch (erro) {
                mensagem.style.color = "red";
                mensagem.textContent = "Erro ao conectar com o servidor.";
            }
        });
    </script>
</body>
</html>
