<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Portfólio</title>
    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
            background-color: rgb(206, 159, 182);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center {
            width: 360px;
            min-height: 420px;
            background: #ffffff;
            border-radius: 10px;
            padding: 0 40px 30px 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .center h1 {
            text-align: center;
            padding: 20px 0;
            margin: 0 0 25px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.4);
            font-size: 32px;
        }

        .text_field {
            position: relative;
            border-bottom: 2px solid #000000;
            margin: 25px 0;
        }

        .text_field input, .text_field select {
            width: 100%;
            padding: 0 5px;
            height: 40px;
            font-size: 16px;
            border: none;
            background: none;
            outline: none;
        }

        .text_field label {
            position: absolute;
            top: 50%;
            left: 5px;
            color: rgb(121, 4, 59);
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
            transition: 0.3s;
        }

        .text_field input:focus ~ label,
        .text_field input:valid ~ label {
            top: -5px;
            color: rgb(121, 4, 59);
            font-size: 14px;
        }

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .botoes input, .botoes button {
            width: 100%;
            height: 40px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
        }

        .btn-cadastrar {
            border: 1px solid rgb(121, 4, 59);
            background: rgb(121, 4, 59);
            color: #ffffff;
        }

        .btn-cadastrar:hover {
            background: rgb(206, 159, 182);
            border-color: rgb(206, 159, 182);
        }

        .btn-auto {
            border: 1px solid #333;
            background: #f4f4f4;
            color: #333;
        }

        .btn-auto:hover {
            background: #e0e0e0;
        }

        .signup_link {
            margin: 15px 0 0;
            text-align: center;
            font-size: 16px;
        }

        .signup_link a {
            text-decoration: none;
            color: #000000;
        }

        .signup_link a:hover {
            text-decoration: underline;
            color: rgb(206, 159, 182);
        }

        #mensagem {
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>

    <div class="center">
        <h1>CADASTRO</h1>

        <form id="cadastroForm">
            <div class="text_field">
                <input type="email" id="email" required autocomplete="email">
                <label for="email">E-mail</label>
            </div>

            <div class="text_field">
                <input type="password" id="senha" required autocomplete="new-password">
                <label for="senha">Senha</label>
            </div>

            <div class="text_field" style="border-bottom: 1px solid #000;">
                <select id="tipo" required style="cursor: pointer; margin-top: 10px;">
                    <option value="aluna">Aluna</option>
                    <option value="professores">Professores</option>
                </select>
            </div>

            <p id="mensagem"></p>

            <div class="botoes">
                <input type="submit" value="Cadastrar" class="btn-cadastrar">
                <button type="button" class="btn-auto" onclick="criarUsuariosPadrao()">Criar Cecília e Professor</button>
            </div>

            <div class="signup_link">
                <a href="login.html">Já tem uma conta? Faça login!</a>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://tkgwntyzlzuvjrcdhcre.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9d3JAJtGyDgB4R6ncvWj3g_fzXeYj4h';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const cadastroForm = document.getElementById("cadastroForm");
        const mensagem = document.getElementById("mensagem");

        // CADASTRO MANUAL
        cadastroForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;
            const tipo = document.getElementById("tipo").value;

            if (!email || !senha) {
                mensagem.style.color = "red";
                mensagem.textContent = "Preencha e-mail e senha.";
                return;
            }

            try {
                mensagem.style.color = "#000000";
                mensagem.textContent = "Criando conta...";

                const { data, error } = await _supabase.auth.signUp({
                    email: email,
                    password: senha,
                    options: {
                        data: { tipo: tipo }
                    }
                });

                if (error) {
                    mensagem.style.color = "red";
                    mensagem.textContent = "Erro ao cadastrar: " + error.message;
                } else {
                    mensagem.style.color = "green";
                    mensagem.textContent = "Cadastro realizado! Redirecionando...";

                    setTimeout(() => window.location.href = "login.html", 1500);
                }
            } catch (erro) {
                mensagem.style.color = "red";
                mensagem.textContent = "Erro de conexão.";
            }
        });

        // CRIAR OS DOIS USUÁRIOS PADRÃO COM UM CLIQUE
        async function criarUsuariosPadrao() {
            mensagem.style.color = "#000000";
            mensagem.textContent = "Cadastrando usuários padrão...";

            // 1. Cadastra a Cecília
            await _supabase.auth.signUp({
                email: 'cecilia@senai.com',
                password: '123456',
                options: { data: { tipo: 'aluna' } }
            });

            // 2. Cadastra o Professor
            await _supabase.auth.signUp({
                email: 'prof@gmail.com',
                password: '123456',
                options: { data: { tipo: 'professores' } }
            });

            mensagem.style.color = "green";
            mensagem.textContent = "Usuários 'cecilia@senai.com' e 'prof@gmail.com' criados com sucesso!";
        }
    </script>
</body>
</html>
