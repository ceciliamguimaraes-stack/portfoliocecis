<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <title>Considerações Finais</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="historia.css">

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', Arial, sans-serif;
    }

    body{
      background-color: #c996ab;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px;
    }

    .container{
      width: 90%;
      max-width: 900px;

      background-color: #f5c7da;

      padding: 30px 50px;

      border: 2px solid #e7c7cf;
      border-radius: 20px;

      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .linha{
      width: 100%;
      height: 4px;

      background-color: rgb(121, 4, 59);

      border-radius: 10px;
    }

    h1{
      text-align: center;

      color: rgb(121, 4, 59);

      font-size: clamp(35px, 5vw, 60px);

      margin: 25px 0 35px;

      font-weight: 800;
    }

    /* TEXTO DAS CONSIDERAÇÕES */
    .texto-final{
      background-color: #fff8fa;

      padding: 35px 45px;

      border-radius: 15px;

      box-shadow: 0 8px 20px rgba(0,0,0,0.12);

      border-left: 6px solid rgb(121, 4, 59);
    }

    .texto-final p{
      font-size: 18px;

      line-height: 1.8;

      color: #4a3a40;

      text-align: justify;

      margin-bottom: 20px;
    }

    .texto-final p:last-child{
      margin-bottom: 0;
    }

    .linha-baixo{
      margin-top: 40px;
    }

    .flor{
      width: 120px;

      display: block;

      margin: 20px auto 0;
    }

    /* RESPONSIVIDADE */
    @media(max-width: 700px){

      body{
        padding: 15px;
      }

      .container{
        width: 100%;
        padding: 25px;
      }

      h1{
        font-size: 35px;
      }

      .texto-final{
        padding: 25px;
      }

      .texto-final p{
        font-size: 16px;
        text-align: left;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="linha"></div>

    <h1>
  <i class="fa-solid fa-magnifying-glass"></i>
  REFERÊNCIAS
</h1>

    <div class="texto-final">

      <p>
        https://www.todamateria.com.br/
      </p>

      <p>
       https://brasilescola.uol.com.br/
      </p>

      <p>
        https://chatgpt.com/
      </p>

      <p>
       https://gemini.google.com/app?hl=pt-BR
      </p>

    </div>

    <div class="linha linha-baixo"></div>

    <img src="./image-removebg-preview (5).png" class="flor" alt="Flor">

  </div>

</body>
</html>
